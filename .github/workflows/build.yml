
name: Build PMS Shelf Variants

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Minecraft mod
        run: gradle build --stacktrace

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam

      - name: Update antivirus definitions
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: Scan compiled JAR
        run: clamscan --infected --recursive build/libs/

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pms-shelf-variants
          path: build/libs/*.jar
          if-no-files-found: error
