plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.124'
}

group = 'com.pms'
version = '0.2.0'
base.archivesName = 'pms-shelf-variants'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.265'
    runs { client { client() }; server { server() } }
    mods { pmsshelves { sourceSet sourceSets.main } }
}

dependencies {
    compileOnly files('libs/shelvesbackport-1.0.0.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
